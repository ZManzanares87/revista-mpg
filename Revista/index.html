  <!-- ===== Ocultar botón "Redes Sociales" y cerrar hueco (pegar siempre al final) ===== -->
  <style>
    /* Oculta el botón/ícono de compartir */
    .button[aria-label="Redes Sociales"],
    [role="button"][aria-label="Redes Sociales"],
    img[alt="sharethis"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
  <script>
    (function(){
      function removeShareAndCollapse(){
        // 1) Eliminar el botón/ícono
        const selector = '.button[aria-label="Redes Sociales"],[role="button"][aria-label="Redes Sociales"],img[alt="sharethis"]';
        let removed = false;
        document.querySelectorAll(selector).forEach(el=>{
          const host = el.closest('.button,[role="button"]') || el;
          if (host && host.parentElement) {
            host.parentElement.removeChild(host);
            removed = true;
          }
        });

        // 2) Si quitamos algo, recompactar los demás (evitar hueco)
        if (!removed) return;

        // Detectar contenedor de la barra
        const bar = (function(){
          const candidates = [
            '.toolbar','.toolBar','.pdfToolBar','.webtoolbar',
            '.buttons','.btnContainer','.pageToolBar',
            '.readerToolbar','.fliptoolbar'
          ];
          for (const sel of candidates) {
            const el = document.querySelector(sel);
            if (el && el.querySelectorAll('.button').length) return el;
          }
          const anyBtn = document.querySelector('.button');
          return anyBtn ? anyBtn.parentElement : null;
        })();
        if (!bar) return;

        // Reposicionar izquierda → derecha sin huecos
        const btns = Array.from(bar.querySelectorAll('.button')).filter(b=>b.offsetParent);
        btns.sort((a,b)=> parseFloat(getComputedStyle(a).left||'0') - parseFloat(getComputedStyle(b).left||'0'));
        let x = 0, gap = 6;
        btns.forEach(b=>{
          const w = b.offsetWidth || parseFloat(getComputedStyle(b).width) || 24;
          b.style.left = x + 'px';
          x += w + gap;
        });
      }

      // Ejecutar ahora y en re-renderizados del visor
      removeShareAndCollapse();
      new MutationObserver(removeShareAndCollapse).observe(document.documentElement, { childList:true, subtree:true });
    })();
  </script>
  <!-- ===== /fin ocultar y recompactar ===== -->
